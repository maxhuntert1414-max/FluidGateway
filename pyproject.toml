[project]
name = "fluidgateway"
version = "0.25.0"
description = "A diagnostic CLI for probable waste in CPU/GPU/display frame pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "FluidGateway contributors" }
]
keywords = ["presentmon", "gpu", "dx12", "performance", "frame-pacing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Benchmark"
]

[project.scripts]
fluidgateway = "fluidgateway.cli:main"
